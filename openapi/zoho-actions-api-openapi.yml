  schemas:
    FlatErrorResponse:
      type: object
      description: Flat error object.
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Error code
          maxLength: 100
        details:
          type: object
          description: Details
          additionalProperties: true
        message:
          type: string
          description: Message
          maxLength: 1000
        status:
          type: string
          description: Status
          maxLength: 100
    SuccessResponse:
      type: object
      description: Successful operation response.
      additionalProperties: false
      properties:
        data:
          type: array
          description: Results list
          maxItems: 10
          items:
            type: object
            description: Status item
            additionalProperties: false
            properties:
              code:
                type: string
                description: Code
                enum:
                - SUCCESS
              status:
                type: string
                description: Status
                enum:
                - success
              message:
                type: string
                description: Message
                maxLength: 500
              details:
                type: object
                description: Meta details
                additionalProperties: false
                properties:
                  message_id:
                    type: string
                    description: Message ID
                    maxLength: 255
    ErrorDetail:
      type: object
      description: Individual error item.
      additionalProperties: false
      properties:
        code:
          type: string
          description: Code
          maxLength: 100
        details:
          type: object
          description: Details
          additionalProperties: true
        message:
          type: string
          description: Message
          maxLength: 1000
        status:
          type: string
          description: Status
          maxLength: 100
    SendMailRequest:
      type: object
      description: Root object for the send mail request.
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          description: List of mail objects.
          maxItems: 1
          items:
            type: object
            description: Detailed email configuration.
            additionalProperties: false
            required:
            - from
            - to
            properties:
              from:
                $ref: '#/components/schemas/EmailUser'
              to:
                type: array
                description: Primary recipients
                maxItems: 50
                items:
                  $ref: '#/components/schemas/EmailUser'
              cc:
                type: array
                description: CC recipients
                maxItems: 50
                items:
                  $ref: '#/components/schemas/EmailUser'
              bcc:
                type: array
                description: BCC recipients
                maxItems: 50
                items:
                  $ref: '#/components/schemas/EmailUser'
              reply_to:
                $ref: '#/components/schemas/EmailUser'
              subject:
                type: string
                description: Email subject
                maxLength: 1000
              content:
                type: string
                description: Body content
                maxLength: 100000
              mail_format:
                type: string
                description: Format
                enum:
                - html
                - text
              org_email:
                type: boolean
                description: Send via org email
              scheduled_time:
                type: string
                description: ISO8601 time
                format: date-time
              consent_email:
                type: boolean
                description: GDPR consent flag
              template:
                type: object
                description: Template reference
                additionalProperties: false
                properties:
                  id:
                    type: string
                    description: Template ID
                    maxLength: 100
              inventory_details:
                type: object
                description: Inventory details
                additionalProperties: false
                properties:
                  inventory_template:
                    type: object
                    description: Inventory template object
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        description: ID
                        maxLength: 100
                      name:
                        type: string
                        description: Name
                        maxLength: 100
                  paper_type:
                    type: string
                    description: Paper size
                    enum:
                    - default
                    - A4
                    - us_letter
                  view_type:
                    type: string
                    description: Orientation
                    enum:
                    - portrait
                    - landscape
              data_subject_request:
                type: object
                description: GDPR request details
                additionalProperties: false
                properties:
                  id:
                    type: string
                    description: Request ID
                    maxLength: 100
                  type:
                    type: string
                    description: Request type
                    enum:
                    - access
                    - rectify
                    - export
              attachments:
                type: array
                description: ZFS file IDs
                maxItems: 10
                items:
                  type: object
                  description: File object
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                      description: File ID
                      maxLength: 255
    EmailUser:
      type: object
      description: User email and name details.
      additionalProperties: false
      required:
      - email
      properties:
        user_name:
          type: string
          description: Name
          maxLength: 255
        email:
          type: string
          description: Email address
          maxLength: 255
    StandardErrorResponse:
      type: object
      description: Error data wrapper.
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          description: Errors list
          maxItems: 10
          items:
            $ref: '#/components/schemas/ErrorDetail'
    FilterField:
      type: object
      description: Specifies the field to filter on when counting related records.
      additionalProperties: false
      properties:
        api_name:
          type: string
          description: The API name of the field to filter on.
          pattern: ^[A-Za-z0-9_]+$
          minLength: 1
          maxLength: 100
      required:
      - api_name
    RelatedRecordCountItem:
      type: object
      description: Specifies a related list to count and optional filtering criteria.
      additionalProperties: false
      properties:
        related_list:
          $ref: '#/components/schemas/RelatedListReference'
        params:
          $ref: '#/components/schemas/CountParameters'
      required:
      - related_list
    ErrorDetails:
      oneOf:
      - type: object
        description: Error details with field information
        additionalProperties: false
        properties:
          api_name:
            type: string
            description: The API name of the field that caused the error
            maxLength: 100
          json_path:
            type: string
            description: JSON path to the field that caused the error
            maxLength: 500
        required:
        - api_name
        - json_path
      - type: object
        description: Error details with expected data type information
        additionalProperties: false
        properties:
          expected_data_type:
            type: string
            description: The expected data type for the field
            maxLength: 100
          api_name:
            type: string
            description: The API name of the field that caused the error
            maxLength: 100
          json_path:
            type: string
            description: JSON path to the field that caused the error
            maxLength: 500
        required:
        - expected_data_type
        - api_name
        - json_path
      - type: object
        description: Error details with expected fields information
        additionalProperties: false
        properties:
          expected_fields:
            type: array
            description: List of expected fields
            items:
              type: object
              description: Expected field information
              additionalProperties: false
              properties:
                api_name:
                  type: string
                  description: The API name of the expected field
                  maxLength: 100
                json_path:
                  type: string
                  description: JSON path to the expected field
                  maxLength: 500
              required:
              - api_name
              - json_path
            maxItems: 20
        required:
        - expected_fields
      - type: object
        description: Error details with parameter name
        additionalProperties: false
        properties:
          param_name:
            type: string
            description: The name of the parameter that caused the error
            maxLength: 255
        required:
        - param_name
      - type: object
        description: Error details with supported values
        additionalProperties: false
        properties:
          supported_value:
            type: array
            description: List of supported values for the field
            items:
              type: string
              description: A supported value
              maxLength: 255
            maxItems: 20
          api_name:
            type: string
            description: The API name of the field that caused the error
            maxLength: 100
          json_path:
            type: string
            description: JSON path to the field that caused the error
            maxLength: 500
        required:
        - supported_value
        - api_name
        - json_path
      - type: object
        description: Error details with maximum length information
        additionalProperties: false
        properties:
          api_name:
            type: string
            description: The API name of the field that caused the error
            maxLength: 100
          json_path:
            type: string
            description: JSON path to the field that caused the error
            maxLength: 500
          maximum_length:
            type: integer
            format: int32
            description: The maximum allowed length for the field
        required:
        - api_name
        - json_path
        - maximum_length
    RelatedListReference:
      type: object
      description: Identifies a specific related list by its API name and unique identifier.
      additionalProperties: false
      properties:
        api_name:
          type: string
          description: The API name of the related list (e.g., 'Contacts', 'Deals', 'Tasks').
          pattern: ^[A-Za-z0-9_]+$
          minLength: 1
          maxLength: 100
        id:
          type: string
          description: The unique identifier of the related list definition.
          pattern: ^[0-9]+$
          minLength: 1
          maxLength: 20
      required:
      - api_name
      - id
    FilterCriteria:
      type: object
      description: Field-based filter criteria to apply before counting records.
      additionalProperties: false
      properties:
        comparator:
          type: string
          description: The comparison operator to use for filtering.
          enum:
          - equal
        field:
          $ref: '#/components/schemas/FilterField'
        value:
          type: string
          description: The value to compare the field against.
          minLength: 1
          maxLength: 255
      required:
      - comparator
      - field
      - value
    ErrorResponse:
      type: object
      description: Error response structure
      additionalProperties: false
      properties:
        status:
          type: string
          description: The status of the response
          enum:
          - error
        code:
          type: string
          description: The error code
          enum:
          - INVALID_DATA
          - PATTERN_NOT_MATCHED
          - MANDATORY_NOT_FOUND
          - EXPECTED_FIELD_MISSING
          - NOT_SUPPORTED
          - DEPENDENT_FIELD_MISMATCH
        message:
          type: string
          description: The error message
          maxLength: 1000
        details:
          $ref: '#/components/schemas/ErrorDetails'
      required:
      - status
      - code
      - message
      - details
    RelatedRecordCountResult:
      type: object
      description: The count result for a specific related list.
      additionalProperties: false
      properties:
        count:
          type: integer
          format: int32
          description: The total number of related records matching the specified criteria.
          minimum: 0
        related_list:
          $ref: '#/components/schemas/RelatedListReference'
      required:
      - count
      - related_list
    CountParameters:
      type: object
      description: Optional filtering and selection parameters to apply before counting records.
      additionalProperties: false
      properties:
        approved:
          type: boolean
          description: Filter to include only approved records when counting.
        filters:
          $ref: '#/components/schemas/FilterCriteria'
        converted:
          type: boolean
          description: Filter to include only converted records when counting (applicable to Leads).
        category:
          type: string
          description: Filter by record category type.
          enum:
          - link
          - files
        approval_state:
          type: string
          description: Filter by approval workflow state.
          enum:
          - approved
      required:
      - filters
    GetRelatedRecordsCountResponse:
      type: object
      description: Successful response containing count results for the requested related lists.
      additionalProperties: false
