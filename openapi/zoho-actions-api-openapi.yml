  /{module}/actions/mass_delete:
    post:
      operationId: massDelete
      summary: Mass delete with record ids and custom view id
      description: Mass delete records with record ids or custom view id
      parameters:
      - $ref: '#/components/parameters/Module_3'
      requestBody:
        description: Request body containing record IDs to delete or custom view ID (`cvid`) with or without territory. Maximum 500 IDs per request.
        content:
          application/json:
            schema:
              type: object
              description: Request body containing **either** record IDs to delete **or** custom view ID with optional territory filter. Maximum 500 IDs per request.
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    pattern: ^[0-9]+$
                    format: string
                    description: Record ID
                  minItems: 1
                  maxItems: 500
                  description: Array of record IDs to delete. Mutually exclusive with `cvid`.
                cvid:
                  type: string
                  pattern: ^[0-9]+$
                  format: string
                  description: Custom view ID. Mutually exclusive with `ids`.
                territory:
                  type: object
                  properties:
                    id:
                      type: string
                      pattern: ^[0-9]+$
                      format: string
                      description: Territory ID
                    include_child:
                      type: boolean
                      description: Whether to include child territories.
                  additionalProperties: false
                  required:
                  - id
                  description: Territory filter for the delete operation (optional, only valid with `cvid`).
              oneOf:
              - description: ids passed for mass delete
                type: object
                properties:
                  ids:
                    description: record ids
                    type: array
                    items:
                      description: record id
                      type: string
                      pattern: ^[0-9]+$
                      format: string
                    minItems: 1
                    maxItems: 500
                required:
                - ids
                additionalProperties: false
              - description: cvid with territory passed for mass delete
                type: object
                properties:
                  cvid:
                    description: custom view id
                    type: string
                    pattern: ^[0-9]+$
                    format: string
                  territory:
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: ^[0-9]+$
                        format: string
                        description: Territory ID
                      include_child:
                        type: boolean
                        description: Whether to include child territories.
                    additionalProperties: false
                    required:
                    - id
                    description: Territory filter for the delete operation
                required:
                - cvid
                additionalProperties: false
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Successfully deleted one or more records synchronously, or scheduled a batch delete operation asynchronously.
          content:
            application/json:
              schema:
                type: object
                description: Mass delete success response
                properties:
                  data:
                    description: Array of success responses (synchronous record deletions or batch job scheduling)
                    type: array
                    minItems: 1
                    maxItems: 500
                    items:
                      oneOf:
                      - description: Individual record deleted synchronously
                        type: object
                        properties:
                          status:
                            description: error status
                            type: string
                            const: success
                          code:
                            description: error code
                            type: string
                            const: SUCCESS
                          message:
                            description: error message
                            type: string
                            const: record is deleted
                          details:
                            description: error details
                            type: object
                            properties:
                              id:
                                type: string
                                pattern: ^[0-9]+$
                                format: string
                                description: ID of the deleted record.
                            required:
                            - id
                            additionalProperties: false
                        additionalProperties: false
                        required:
                        - status
                        - code
                        - message
                        - details
                      - description: Batch delete job scheduled asynchronously (cvid-based deletion)
                        type: object
                        properties:
                          status:
                            description: error status
                            type: string
                            const: success
                          code:
                            description: error code
                            type: string
                            const: SUCCESS
                          message:
                            description: error message
                            type: string
                            const: mass delete scheduled successfully
                          details:
                            description: error details
                            type: object
                            properties:
                              job_id:
                                type: string
                                pattern: ^[0-9]+$
                                format: string
                                description: Job ID for tracking the batch delete operation (use with GET endpoint).
                            required:
                            - job_id
                            additionalProperties: false
                        additionalProperties: false
                        required:
                        - status
                        - code
                        - message
                        - details
                additionalProperties: false
                required:
                - data
        '207':
          description: 'Multi-Status: Some records deleted successfully, others failed validation. Each item in `data` represents an individual record result.'
          content:
            application/json:
              schema:
                description: 'Multi-Status: Some records deleted successfully, others failed validation. Each item in `data` represents an individual record result.'
                type: object
                properties:
                  data:
                    description: 'Multi-Status: Some records deleted successfully, others failed validation. Each item in `data` represents an individual record result.'
                    type: array
                    minItems: 1
                    maxItems: 500
                    items:
                      oneOf:
                      - type: object
                        description: success response
                        properties:
                          status:
                            type: string
                            const: success
                            description: Indicates successful deletion.
                          code:
                            type: string
                            const: SUCCESS
                            description: Success code.
                          message:
                            type: string
                            const: record is deleted
                            description: Confirmation message.
                          details:
                            description: record id
                            type: object
                            properties:
                              id:
                                type: string
                                pattern: ^[0-9]+$
                                format: string
                                description: ID of the deleted record.
                            additionalProperties: false
                            required:
                            - id
                        additionalProperties: false
                        required:
                        - status
                        - code
                        - message
                        - details
                      - description: Invalid id
                        type: object
                        properties:
                          status:
                            type: string
                            const: error
                            description: Indicates deletion failure.
                          code:
                            type: string
                            enum:
                            - INVALID_DATA
                            description: Error code.
                          message:
                            type: string
                            format: string
                            description: Human-readable error description.
                          details:
                            description: record id
                            type: object
                            properties:
                              id:
                                type: string
                                pattern: ^[0-9]+$
                                format: string
                                description: ID of the record that failed deletion.
                            additionalProperties: false
                            required:
                            - id
                        additionalProperties: false
                        required:
                        - status
                        - code
                        - message
                        - details
                additionalProperties: false
