              departmentId:
                type:
                - string
                - 'null'
                - integer
                format: int64
                pattern: ([0-9]+)
              id:
                type:
                - string
                - 'null'
                - integer
                format: int64
                pattern: ([0-9]+)
              title:
                type:
                - string
                - 'null'
                maxLength: 65535
                minLength: 0
              message:
                type:
                - string
                - 'null'
                maxLength: 65535
                minLength: 0
              type:
                type:
                - string
                - 'null'
                enum:
                - TEMPLATE
                - CANNED
                - WELCOMEMSG
                - AWAY
                maxLength: 100
                minLength: 0
              isActive:
                type:
                - boolean
                - 'null'
              tags:
                type:
                - string
                - 'null'
                maxLength: 65535
                minLength: 0
              status:
                type:
                - string
                - 'null'
                enum:
                - SUBMITTED
                - FAILED
                - APPROVED
                - REJECTED
                - PENDING
                maxLength: 100
                minLength: 0
            required:
            - actor
            - departmentId
            - displayMessage
            - id
            - isActive
            - message
            - modifiedTime
            - status
            - tags
            - title
            - translations
            - type
          examples:
            Valid responses Definitions:
              value: null
    getCannedMessages:
      description: getCannedMessages template definitions
      content:
