openapi: 3.1.0
info:
  title: Helpcenter Import API
  version: 1.0.0
tags:
- name: Import
paths:
  /api/v1/importMappings:
    post:
      tags:
      - Import
      summary: Get Import Mappings
      description: This API fetches entity id's for given external ids your help desk portal.
      operationId: getImportMappings
      parameters:
      - $ref: ./Common.json#/components/parameters/orgId
      requestBody:
        $ref: '#/components/requestBodies/importMappingRequest'
      responses:
        '422':
          $ref: ./Common.json#/components/responses/invalidDataErrorResponse
        '200':
          $ref: '#/components/responses/importMappingResponse'
      security:
      - iam-oauth2-schema:
        - Desk.imports.CUSTOM
      x-audience:
      - external-public
  /api/v1/imports/{importId}:
    get:
      tags:
      - Import
      summary: Get Import
      description: This API fetches a single import info from your help desk portal.
      operationId: getImport
      parameters:
      - name: importId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type:
          - string
          - 'null'
          - integer
          format: int64
          pattern: ([0-9]+)
      - $ref: ./Common.json#/components/parameters/orgId
      responses:
        '200':
          $ref: '#/components/responses/importResponse'
      security:
      - iam-oauth2-schema:
        - Desk.imports.CUSTOM
      x-audience:
      - external-public
  /api/v1/imports:
    post:
      tags:
      - Import
      summary: Create Import
      description: This API add a import entry under a given scope in your help desk portal.
      operationId: createImport
      parameters:
      - $ref: ./Common.json#/components/parameters/orgId
      requestBody:
        $ref: '#/components/requestBodies/importRequest'
      responses:
        '422':
          $ref: ./Common.json#/components/responses/invalidDataErrorResponse
        '200':
          $ref: '#/components/responses/importResponse'
      security:
      - iam-oauth2-schema:
        - Desk.imports.CUSTOM
      x-audience:
      - external-public
components:
  responses:
    importResponse:
      description: importResponse template definitions
      content:
        application/json:
          schema:
            type:
            - 'null'
            - object
            additionalProperties: false
            properties:
              importInitiatedTime:
                type:
                - string
                - 'null'
                maxLength: 100
                minLength: 0
                pattern: (((19|20)\d\d)[-/.]{1}(0?[1-9]|1[012])[-/.]{1}(0?[1-9]|[12][0-9]|3[01])(T)([01]?[0-9]|2[0-3]):[0-5]?[0-9]:[0-5]?[0-9]([/.][\d]{0,3})?(Z))
              importCompletedTime:
                type:
                - string
                - 'null'
                maxLength: 100
                minLength: 0
                pattern: (((19|20)\d\d)[-/.]{1}(0?[1-9]|1[012])[-/.]{1}(0?[1-9]|[12][0-9]|3[01])(T)([01]?[0-9]|2[0-3]):[0-5]?[0-9]:[0-5]?[0-9]([/.][\d]{0,3})?(Z))
              scopeId:
                type:
                - string
                - 'null'
                maxLength: 100
                minLength: 0
                pattern: ^([0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12})$
              runAutomation:
                type:
                - boolean
                - 'null'
              errorReportUrl:
                type:
                - string
                - 'null'
                maxLength: 100
                minLength: 0
                pattern: (^(ht|f)tp(s?)\://[-.\w]*(/?)([a-zA-Z0-9\-\.\?\,\:\'/\\+=&amp;%\$#_@]*)?$)
              notifyUrl:
                type:
                - string
                - 'null'
                maxLength: 100
                minLength: 0
                pattern: (^(ht|f)tp(s?)\://[-.\w]*(/?)([a-zA-Z0-9\-\.\?\,\:\'/\\+=&amp;%\$#_@]*)?$)
              id:
                type:
                - string
                - 'null'
                - integer
                format: int64
                pattern: ([0-9]+)
              hasError:
                type:
                - boolean
                - 'null'
              status:
                type:
                - string
                - 'null'
                enum:
                - queued
                - completed
                maxLength: 100
                minLength: 0
              importedBy:
                type:
                - string
                - 'null'
                - integer
                format: int64
                pattern: ([0-9]+)
            required:
            - errorReportUrl
            - hasError
            - id
            - importCompletedTime
            - importInitiatedTime
            - importedBy
            - notifyUrl
            - runAutomation
            - scopeId
            - status
          examples:
            Valid responses Definitions:
              value:
                importInitiatedTime: '2018-12-17T06:40:57.109Z'
                importCompletedTime: '2018-12-17T12:11:04.000Z'
                scopeId: 7d69f2c6-1d6d-4a75-99d1-fafc4e4177a7
                errorReportUrl: https://desk.zoho.com/api/v1/importErrorLog/4000000024001
                runAutomation: 'false'
                notifyUrl: null
                hasError: true
                id: '4000000024001'
                importedBy: '4000000016079'
                status: completed
    importMappingResponse:
      description: importMappingResponse template definitions
      content:
        application/json:
          schema:
            type:
            - 'null'
            - object
            additionalProperties: false
            properties:
              data:
                $ref: ./Import.json#/components/schemas/importMappingData
            required:
            - data
          examples:
            Valid responses Definitions:
              value:
                data:
                - externalId: ticketLayout1
                  entityId: '6000000073007'
  requestBodies:
    importMappingRequest:
      content:
        application/json:
          schema:
            type:
            - 'null'
            - object
            additionalProperties: false
            properties:
              scopeId:
                type:
                - string
                - 'null'
                maxLength: 100
                minLength: 0
                pattern: ^([0-9a-fA-F]{8}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{4}\-[0-9a-fA-F]{12})$
              module:
                type:
                - string
                - 'null'
                enum:
                - accounts
                - contacts
                - tickets
                - tasks
                - calls
                - events
                - threads
                - ticketComments
                - kbRootCategories
                - kbSections
                - articles
                - products
                - taskComments
                - callComments
                - eventComments
                - ticketTimeEntries
