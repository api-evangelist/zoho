                - callTimeEntries
                - eventTimeEntries
                - agents
                - layouts
                - departments
                - fields
                maxLength: 100
                minLength: 0
              externalIds:
                type:
                - 'null'
                - array
                items:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                  minLength: 0
                  pattern: '[A-Za-z0-9@\$&+\:\.\{\}\(\)#\-]+'
                uniqueItems: false
            required:
            - externalIds
            - module
            - scopeId
          examples:
            Valid requestBody Definitions:
              value:
                scopeId: 74da0304-e8e2-4f74-9da1-5359e4359d9a
                module: tickets
                externalIds:
                - ticketLayout1
                - ticketLayout3
