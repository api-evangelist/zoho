                type: object
                description: Success response for note deletion
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: Array of deletion results
                    maxItems: 1
                    items:
                      type: object
                      description: Individual note deletion result
                      additionalProperties: false
                      properties:
                        code:
