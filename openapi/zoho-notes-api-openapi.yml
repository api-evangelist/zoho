                        status:
                          type: string
                          description: Status of the operation
                          enum:
                          - success
                        details:
                          type: object
                          description: Deleted note details
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              description: Unique identifier of the deleted note
                              format: int64
                          required:
                          - id
                      required:
                      - code
                      - message
                      - status
                      - details
                required:
                - data
        '400':
          description: Bad Request - Invalid data
          content:
            application/json:
              schema:
