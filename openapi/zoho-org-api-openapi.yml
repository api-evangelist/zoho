    put:
      summary: Update currency by ID
      description: Update a specific currency by its unique ID.
      operationId: updateCurrencyById
      parameters:
      - $ref: '#/components/parameters/Currency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload for updating a specific currency by ID.
              properties:
                currencies:
                  type: array
                  description: List of currencies to update (single-element array expected).
                  maxItems: 100
                  items:
                    type: object
                    description: Currency object containing update fields.
                    additionalProperties: false
                    properties:
                      format:
                        type: object
                        description: Configuration for currency formatting rules.
                        additionalProperties: false
                        properties:
                          numeral_system:
                            type: string
                            enum:
                            - Indian
                            - International
                            default: International
                            description: Defines the numbering system used for digit grouping.
                          decimal_places:
                            type: string
                            enum:
                            - '0'
                            - '2'
                            - '3'
                            - '4'
                            - '5'
                            - '6'
                            description: Specifies number of fractional digits allowed in currency format.
                          decimal_separator:
                            type: string
                            enum:
                            - Comma
                            - Period
                            description: Character used to separate whole numbers and fractional part.
                          thousand_separator:
                            type: string
                            enum:
                            - Comma
                            - Period
                            - Space
                            description: Character used to separate thousands for currency display.
                      exchange_rate:
                        type: string
                        pattern: ^[0-9]{1,9}(\.[0-9]{1,9})?$
                        maxLength: 18
                        description: Rate at which this currency exchanges with the base currency.
                      is_active:
                        type: boolean
                        description: Indicates whether the currency is active and available for use.
                      exchange_rate_auto_update:
                        type: boolean
                        description: Indicates whether the currency has the automated exchange rate option enabled or not.
              required:
              - currencies
              additionalProperties: false
      responses:
        '200':
          description: Successfully updated the specified currency record(s).
          content:
            application/json:
              schema:
                type: object
                description: Response object containing updated currency data.
                additionalProperties: false
                required:
                - currencies
                properties:
                  currencies:
                    type: array
                    description: List of updated currency responses.
                    maxItems: 100
                    items:
                      type: object
                      description: Individual currency update response
                      properties:
                        code:
                          type: string
                          description: Response code
                          maxLength: 255
                        message:
                          type: string
                          description: Response message
                          maxLength: 255
                        details:
                          type: object
                          description: Detailed information about the currency update
                          properties:
                            id:
                              type: string
                              description: Unique currency ID
                              maxLength: 50
                          required:
                          - id
                          additionalProperties: true
                        status:
                          type: string
                          description: Status of the response
                          enum:
                          - success
                      required:
                      - code
                      - message
                      - details
                      - status
                      additionalProperties: false
        '400':
          description: Bad request. The input contains malformed or invalid values.
          content:
            application/json:
              schema:
                description: Possible error responses for currency update operation.
                oneOf:
                - type: object
                  description: Permission-level or single validation error.
                  additionalProperties: false
                  required:
                  - code
                  - message
                  - status
                  - details
                  properties:
                    code:
                      type: string
                      description: Error identifier representing the failure type.
                      enum:
                      - NO_PERMISSION
                      - INVALID_DATA
                      maxLength: 100
                    message:
                      type: string
                      description: Human-readable message describing the error.
                      maxLength: 255
                    details:
                      type: object
                      description: Additional information about the error.
                      additionalProperties: true
                      properties:
                        permissions:
                          type: array
                          description: List of required permissions missing for the current user.
                          maxItems: 100
                          items:
                            type: string
                            description: Needed permission details
                            maxLength: 100
                    status:
                      type: string
                      description: Indicates that the response represents an error condition.
                      enum:
                      - error
                      maxLength: 20
                - type: object
                  description: Currency validation errors.
                  additionalProperties: false
                  required:
                  - currencies
                  properties:
                    currencies:
                      type: array
                      description: Array of currency error objects representing individual validation or permission errors.
                      maxItems: 100
                      items:
                        type: object
                        description: An object representing a single currency-related error.
                        additionalProperties: false
                        required:
                        - code
                        - message
                        - details
                        - status
                        properties:
                          code:
                            type: string
                            description: Error identifier representing the validation failure type.
                            enum:
                            - INVALID_DATA
                            - ACTIVE_STATE_LIMIT_EXCEEDED
                            - NOT_ALLOWED
                            maxLength: 100
                          message:
                            type: string
                            description: Human-readable message describing the error.
                            maxLength: 255
                          details:
                            type: object
                            description: Additional debugging metadata for the error. Provides field-level or permission-level details.
                            additionalProperties: true
                            properties:
                              api_name:
                                type: string
                                description: The field name, API parameter, or array index related to the error.
                                maxLength: 255
                              json_path:
                                type: string
                                description: JSON path pointing to the field that caused the error.
                                maxLength: 255
                              limit:
                                type: integer
                                description: Maximum allowed limit relevant to the error, e.g., max active currencies.
                                format: int32
                              expected_data_type:
                                type: string
                                description: Expected data type for the invalid field.
                                maxLength: 50
                          status:
                            type: string
                            description: Indicates that the response represents an error condition.
                            enum:
                            - error
                            maxLength: 20
      security:
      - iam-oauth2-schema:
        - ZohoCRM.settings.currencies.UPDATE
      tags:
      - Org
