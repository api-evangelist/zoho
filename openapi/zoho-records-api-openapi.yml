                additionalProperties: false
                properties:
                  code:
                    type: string
                    description: Machine-readable error code identifying the reason the delete request failed.
                    enum:
                    - INVALID_DATA
                    - UNABLE_TO_PARSE_DATA_TYPE
                    - INVALID_MODULE
                    - INVALID_REQUEST_METHOD
                    - AUTHORIZATION_FAILED
                    - RECORD_LOCKED
                    - NOT_APPROVED
                    - REQUIRED_PARAM_MISSING
                  message:
                    type: string
                    maxLength: 1024
                    description: Human-readable explanation describing why the delete request failed.
                  details:
                    type: object
                    description: Additional contextual information related to the error.
                    additionalProperties: false
                    properties:
                      resource_path_index:
                        type: integer
                        format: int32
                        description: Index of the resource in the request path where the error occurred.
                      id:
                        type: string
                        maxLength: 255
                        description: Identifier of the record related to the error.
                      param:
                        type: string
                        maxLength: 255
                        description: Name of the parameter that caused the error.
                  status:
                    type: string
                    description: Indicates that the delete operation resulted in an error.
                    enum:
                    - error
                required:
                - code
                - message
                - status
        '401':
          description: Response returned when the request is unauthorized due to a missing or invalid OAuth scope required for record deletion.
          content:
            application/json:
              schema:
                type: object
                description: Error response schema returned when OAuth scope validation fails for delete-by-ID operations.
                additionalProperties: false
                properties:
                  code:
                    type: string
                    description: Machine-readable error code indicating an OAuth scope mismatch.
                    enum:
                    - OAUTH_SCOPE_MISMATCH
                  message:
                    type: string
                    maxLength: 1024
                    description: Human-readable message indicating the request is unauthorized.
                  status:
                    type: string
                    description: Indicates the operation resulted in an authorization error.
                    enum:
                    - error
                required:
                - code
                - message
                - status
        '403':
          description: Response returned when the user does not have permission to delete the requested record.
          content:
            application/json:
              schema:
                type: object
                description: Error response schema returned when record deletion is blocked due to insufficient permissions.
                additionalProperties: false
                properties:
                  code:
                    type: string
                    description: Machine-readable error code indicating permission denial.
                    enum:
                    - NO_PERMISSION
                  message:
                    type: string
                    maxLength: 1024
                    description: Human-readable explanation indicating the user lacks delete permission.
                  status:
                    type: string
                    description: Indicates the operation resulted in an error.
                    enum:
                    - error
                required:
                - code
                - message
                - status
        '404':
          description: Response returned when the API endpoint URL is invalid or the requested resource is not found.
          content:
            application/json:
              schema:
                type: object
                description: Error response schema returned for invalid URL patterns during record deletion by ID.
                additionalProperties: false
                properties:
                  data:
                    type: array
                    maxItems: 100
                    description: List of error objects describing the invalid URL pattern.
                    items:
                      type: object
                      description: Error object representing an invalid URL pattern or unsupported endpoint.
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          description: Machine-readable error code indicating an invalid API endpoint URL.
                          enum:
                          - INVALID_URL_PATTERN
                        message:
                          type: string
                          maxLength: 1024
                          description: Human-readable explanation indicating the URL is incorrect or unsupported.
                        status:
                          type: string
                          description: Indicates the operation resulted in an error.
                          enum:
                          - error
                      required:
                      - code
                      - message
                      - status
                required:
                - data
        '500':
          description: Internal server error response returned when record deletion fails due to an unexpected server-side issue.
          content:
            application/json:
              schema:
                type: object
                description: Response schema returned when an internal error occurs while deleting a record by ID.
                additionalProperties: false
                properties:
                  data:
                    type: array
                    maxItems: 100
                    description: List of error objects describing the internal server failure.
                    items:
                      type: object
                      description: Error object representing an internal server error.
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          description: Machine-readable error code indicating an internal server failure.
                          enum:
                          - INTERNAL_ERROR
                        message:
                          type: string
                          maxLength: 1024
                          description: Human-readable description of the internal server error.
                        status:
                          type: string
                          description: Indicates the operation resulted in an error.
                          enum:
                          - error
                      required:
                      - code
                      - message
                      - status
                required:
                - data
