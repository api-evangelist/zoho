                  message:
                    type: string
                    maxLength: 1024
                    description: Message explaining why the delete operation is forbidden.
                  status:
                    type: string
                    description: Status indicating the failure of the request.
                    enum:
                    - error
                required:
                - code
                - message
                - status
        '404':
          description: Response returned when the API endpoint URL is invalid or the requested resource does not exist.
          content:
            application/json:
              schema:
                type: object
                description: Error response indicating an invalid URL pattern or missing resource.
