  schemas:
    ErrorResponse:
      type: object
      description: A standard error response from the Zoho CRM API.
      additionalProperties: false
      properties:
        code:
          type: string
          description: The unique error code.
          maxLength: 64
        message:
          type: string
          description: A human-readable description of the error.
          maxLength: 512
        details:
          type: object
          description: Additional details about the error, often containing the field API name.
          additionalProperties: false
        status:
          type: string
          description: Indicates the response is an error.
          enum:
          - error
    RecordUnathorizedResponse:
      description: Response schema returned when a request is unauthorized due to OAuth scope mismatches.
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          maxItems: 100
          description: List of error objects indicating that the request is not authorized.
          items:
            type: object
            description: Error object representing an OAuth scope mismatch.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Machine-readable error code indicating an OAuth scope mismatch.
                enum:
                - OAUTH_SCOPE_MISMATCH
              message:
                type: string
                maxLength: 1024
                description: Human-readable explanation describing why the OAuth token is unauthorized.
              status:
                type: string
                description: Overall execution status of the request.
                enum:
                - error
            required:
            - code
            - message
            - status
    RecordInternalErrorResponse:
      description: Schema for internal server error responses related to record operations.
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          maxItems: 100
          description: List of error objects describing internal server failures.
          items:
            type: object
            description: Error object representing an unexpected internal server error.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Machine-readable error code indicating an internal server failure.
                enum:
                - INTERNAL_ERROR
              message:
                type: string
                maxLength: 1024
                description: Human-readable description of the internal server error.
              status:
                type: string
                description: Overall execution status of the request.
                enum:
                - error
            required:
            - code
            - message
            - status
    RecordInvalidURLResponse:
      description: Response schema returned when the requested API endpoint URL pattern is invalid or unsupported.
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          maxItems: 100
          description: List of error objects indicating an invalid or unsupported API endpoint URL.
          items:
            type: object
            description: Error object representing an invalid API URL pattern.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Machine-readable error code indicating an invalid endpoint URL pattern.
                enum:
                - INVALID_URL_PATTERN
              message:
                type: string
                maxLength: 1024
                description: Human-readable explanation describing why the requested URL is invalid.
              status:
                type: string
                description: Overall execution status of the request.
                enum:
                - error
            required:
            - code
            - message
            - status
    RecordGETErrorResponse:
      description: Error response schema returned when GET record or GET records operations fail due to validation, pagination, or processing errors.
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          maxItems: 100
          description: List of error objects describing failures encountered while processing GET record(s) requests.
          items:
            type: object
            description: Error object representing a single GET record(s) operation failure.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Machine-readable error code indicating the specific reason for the GET operation failure.
                enum:
                - INVALID_DATA
                - TOKEN_BOUND_DATA_MISMATCH
                - INVALID_MODULE
                - REQUIRED_PARAM_MISSING
                - LIMIT_EXCEEDED
                - EXPIRED_VALUE
                - DISCRETE_PAGINATION_LIMIT_EXCEEDED
                - AMBIGUITY_DURING_PROCESSING
                - PAGINATION_LIMIT_EXCEEDED
              message:
                type: string
                maxLength: 1024
                description: Human-readable description explaining why the GET operation failed.
              details:
                type: object
                description: Additional metadata providing context about the error.
                additionalProperties: true
                properties:
                  resource_path_index:
                    type: integer
                    format: int32
                    description: Index of the resource path segment where the error occurred.
                required:
                - resource_path_index
              status:
                type: string
                description: Overall execution status of the GET request.
                enum:
                - error
            required:
            - code
            - message
            - status
    RecordsErrorResponse:
      description: Standard error response schema returned when one or more record operations fail.
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          maxItems: 100
          description: List of error objects describing individual record-level failures.
          items:
            type: object
            description: Error object representing a failure encountered while processing a record.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Machine-readable error code identifying the reason for the failure.
                enum:
                - INVALID_DATA
                - INVALID_MODULE
                - MULTIPLE_OR_MULTI_ERRORS
                - DEPENDENT_FIELD_MISSING
                - DEPENDENT_SERVICE_ERROR
                - MANDATORY_NOT_FOUND
                - DEPENDENT_MISMATCH
                - INVALID_REQUEST_METHOD
                - AUTHORIZATION_FAILED
                - DUPLICATE_DATA
                - LIMIT_EXCEEDED
                - RECORD_LOCKED
                - EXPECTED_FIELD_MISSING
              details:
                type: object
                additionalProperties: true
                description: Additional details associated with the error.
                properties:
                  resource_path_index:
                    type: integer
                    format: int32
                    description: Position of the record in the request payload where the error occurred.
                  api_name:
                    type: string
                    maxLength: 1024
                    description: The API name of the field associated with the error.
                  json_path:
                    type: string
                    maxLength: 1024
                    description: JSONPath pointer to the field that caused the error.
                  expected_fields:
                    type: array
                    maxItems: 100
                    description: Used specifically when the error code is EXPECTED_FIELD_MISSING.
                    items:
                      type: object
                      additionalProperties: false
                      description: Additional information on the missing fields
                      required:
                      - api_name
                      - json_path
                      properties:
                        api_name:
                          maxLength: 1024
                          type: string
                          description: Name of the missing expected field.
                        json_path:
                          maxLength: 1024
                          type: string
                          description: JSONPath location of the expected field.
              message:
                type: string
                maxLength: 1024
                description: Human-readable explanation of the error.
              status:
                type: string
                description: Indicates the outcome of the operation for the record.
                enum:
                - error
            required:
            - code
            - message
            - status
    RecordGETSucessResponse:
      description: Successful response schema returned for GET record or GET records API operations.
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          maxItems: 100
          description: List of records retrieved from the module.
          items:
            type: object
            description: Represents a single record. This object may include both standard and custom fields.
            additionalProperties: true
            properties:
              id:
                type: string
                format: int64
                description: Unique identifier of the record.
              Owner:
                type: object
                description: Details of the user who owns the record.
                additionalProperties: false
                properties:
                  name:
                    type: string
                    maxLength: 100
                    description: Name of the record owner.
                  id:
                    type: string
                    format: int64
                    description: Unique identifier of the record owner.
                  email:
                    type: string
                    maxLength: 256
                    description: Email address of the record owner.
              Created_Time:
                type: string
                format: date-time
                description: Timestamp indicating when the record was created.
              Modified_Time:
                type: string
                format: date-time
                description: Timestamp indicating when the record was last modified.
              Created_By:
                type: object
                description: Details of the user who created the record.
                additionalProperties: false
                properties:
                  name:
                    type: string
                    maxLength: 100
                    description: Name of the user who created the record.
                  id:
                    type: string
                    format: int64
                    description: Unique identifier of the user who created the record.
              Modified_By:
                type: object
                description: Details of the user who last modified the record.
                additionalProperties: false
                properties:
                  name:
                    type: string
                    maxLength: 100
                    description: Name of the user who last modified the record.
                  id:
                    type: string
                    format: int64
                    description: Unique identifier of the user who last modified the record.
            required:
            - id
        info:
          type: object
          description: Pagination and metadata information for the GET records response.
          additionalProperties: false
          properties:
            page:
              type: integer
              format: int32
              description: Current page number.
            call:
              type: boolean
              description: Indicates whether call fields are included in the response.
            per_page:
              type: integer
              format: int32
              description: Number of records returned per page.
            count:
              type: integer
              format: int32
              description: Number of records returned in the current page.
            more_records:
              type: boolean
              description: Indicates whether more records are available for retrieval.
            email:
              type: boolean
              description: Indicates whether email-related fields are included in the response.
            sort_by:
              type: string
              maxLength: 1024
              description: Field name used to sort the records.
            sort_order:
              type: string
              enum:
              - asc
              - desc
              description: Sort order applied to the results (ascending or descending).
            next_page_token:
              maxLength: 1024
              type: string
              description: Token used to fetch the next page of results.
            previous_page_token:
              maxLength: 1024
              type: string
              description: Token used to fetch the previous page of results.
            page_token_expiry:
              maxLength: 1024
              type: string
              format: date-time
              description: Timestamp indicating when the page tokens will expire.
    RecordSuccessResponse:
      description: Standard success response schema for single or bulk record operations.
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          maxItems: 100
          description: List of successfully processed records with detailed metadata.
          items:
            type: object
            description: Success object representing a single successfully processed record.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Machine-readable code indicating a successful operation.
                enum:
                - SUCCESS
              message:
                type: string
                maxLength: 1024
                description: Human-readable success message describing the operation outcome.
              status:
                type: string
                description: Overall execution status of the operation.
                enum:
                - success
              details:
                type: object
                description: Detailed metadata about the processed record.
                additionalProperties: true
                properties:
                  id:
                    type: string
                    format: int64
                    description: Unique identifier of the record.
                  Modified_Time:
                    type: string
                    format: date-time
                    description: Timestamp indicating when the record was last modified.
                  Created_Time:
                    type: string
                    format: date-time
                    description: Timestamp indicating when the record was created.
                  Created_By:
                    type: object
                    description: User who originally created the record.
                    additionalProperties: false
                    properties:
                      name:
                        type: string
                        maxLength: 100
                        description: Display name of the creating user.
                      id:
                        type: string
                        format: int64
                        description: Unique identifier of the creating user.
                    required:
                    - name
                    - id
                  Modified_By:
                    type: object
                    description: User who last modified the record.
                    additionalProperties: false
                    properties:
                      name:
                        type: string
                        maxLength: 100
                        description: Display name of the modifying user.
                      id:
                        type: string
                        format: int64
                        description: Unique identifier of the modifying user.
                    required:
                    - name
                    - id
                  $approval_state:
                    type: string
                    maxLength: 1024
                    description: Approval state of the record in the approval workflow.
                required:
                - id
                - Modified_Time
                - Created_Time
                - Created_By
                - Modified_By
                - $approval_state
            required:
            - code
            - message
            - status
            - details
      required:
      - data
    RecordsInputSchema:
      description: Input schema for create, update, or upsert record requests.
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          maxItems: 100
          description: Request body containing one or more records to be created or updated.
          items:
            type: object
            description: Payload representing a single record to be created or updated.
            additionalProperties: true
            properties:
              id:
                type: string
                maxLength: 1024
                description: Unique identifier of the record. Required when modifying an existing record.
              $append_values:
                type: string
                maxLength: 1024
                description: Controls whether values in a multi-select picklist field should be appended or replaced during an update operation.
        apply_feature_execution:
          type: array
          maxItems: 100
          description: List of features that should be executed on demand during record processing.
          items:
            type: object
            description: Feature execution configuration object.
            additionalProperties: true
        skip_feature_execution:
          type: array
          maxItems: 100
          description: List of features that should be skipped during record processing.
          items:
            type: object
            description: Feature skip configuration object.
            additionalProperties: true
        trigger:
          type: array
          maxItems: 100
          description: List of automation triggers to invoke during the record operation.
          items:
            type: string
            description: Type of automation trigger to be executed.
            enum:
            - approval
            - workflow
            - blueprint
            - pathfinder
            - orchestration
    RecordPermissionResponse:
      description: Response schema returned when a user lacks the necessary permissions to perform a record operation.
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          maxItems: 100
          description: List of error objects indicating insufficient user permissions.
          items:
            type: object
            description: Error object representing a permission denial.
            additionalProperties: false
            properties:
              code:
                type: string
                description: Machine-readable error code indicating the user does not have permission.
                enum:
                - NO_PERMISSION
              message:
                type: string
                maxLength: 1024
                description: Human-readable explanation describing the permission denial.
              status:
                type: string
                description: Overall execution status of the request.
                enum:
                - error
            required:
            - code
            - message
            - status
  securitySchemes:
    iam-oauth2-schema:
      $ref: ./Common.json#/components/securitySchemes/iam-oauth2-schema
