                    - INVALID_URL_PATTERN
                  message:
                    type: string
                    maxLength: 1024
                    description: Message describing the invalid URL or missing resource.
                  status:
                    type: string
                    description: Status indicating request failure.
                    enum:
                    - error
                required:
                - code
                - message
                - status
        '500':
          description: Response returned when an unexpected internal server error occurs during record deletion.
          content:
            application/json:
              schema:
                type: object
