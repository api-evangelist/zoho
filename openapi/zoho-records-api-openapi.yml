components:
  parameters:
    Email:
      name: email
      in: query
      description: Searches for records using an email address. The API searches across all email fields in the specified module and returns matching records. (e.g., `p%2Bboyle@abc.com` for `p+boyle@abc.com`).
      required: false
      schema:
        type: string
        maxLength: 3000
        description: The email address to filter records by. Note that special characters must be URL-encoded (e.g., `p%2Bboyle@abc.com` for `p+boyle@abc.com`).
    PerPage:
      name: per_page
      in: query
      description: The number of records to return per page.
      required: false
      schema:
        type: integer
        format: int32
        default: 200
        minimum: 1
        maximum: 200
        description: Number of records per page for pagination.
    Phone:
      name: phone
      in: query
      description: Searches for records using a phone number. The API searches across all phone fields in the specified module and returns matching records. (e.g., `9876543210`).
      required: false
      schema:
        type: string
        maxLength: 3000
        description: The phone number to filter records by.
    Type:
      name: type
      in: query
      description: Filters users based on their type. This parameter is supported **only for the Users module**.
      required: false
      schema:
        type: string
        description: Specifies the user type to filter records by.
        enum:
        - AllUsers
        - ActiveUsers
        - DeactiveUsers
        - ConfirmedUsers
        - ConfirmedReportingUsers
        - NotConfirmedUsers
        - DeletedUsers
        - ActiveConfirmedUsers
        - AdminUsers
        - ActiveConfirmedAdmins
        - CurrentUser
    Word:
      name: word
      in: query
      required: false
      description: Performs a global search within the specified module using the given word. The matchable records across multiple fields based on the search term. (e.g., `fin` to match records containing 'fin' in any searchable field).
      schema:
        type: string
        maxLength: 3000
        description: The word to filter records by.
    ModuleApiName:
      name: moduleApiName
      in: path
      required: true
      description: The API name of the module to retrieve the record count for.
      schema:
        type: string
        description: The API name of the module for which to retrieve the record count (e.g., `Leads`, `Accounts`).
        maxLength: 5000
    Approved:
      name: approved
      in: query
      description: Filters leads based on their approval status.
      required: false
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
        - both
        description: Set to true to count only converted leads; false to count only unconverted leads.
    Cvid:
      name: cvid
      in: query
      description: The ID of the custom view from which to get the record count.
      required: false
      schema:
        type: string
        maxLength: 3000
        description: The Custom View ID to filter records by.
    Page:
      name: page
      in: query
      description: The page number to retrieve.
      required: false
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
        description: The page number for pagination.
    Converted:
      name: converted
      in: query
      description: Filters leads based on their conversion status.
      required: false
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
        - both
        description: Set to true to count only converted leads; false to count only unconverted leads.
    Criteria:
      name: criteria
      in: query
      description: 'Performs search by following the shown criteria: `(({api_name}:{operator}:{value}) and/or ({api_name}:{operator}:{value}))`


        Performs a search based on the following format:

        `(({field_API_name}:{operator}:{value}) and/or ({field_API_name}:{operator}:{value}))`


        Replace `{field_API_name}`, `{operator}`, and `{value}` with the appropriate field API name, condition, and value.


        **Key Points:**

        - You can search for a maximum of **10 criteria** (with same or different columns)

        - The only operator that is supported for **encrypted fields** is `equals`

        - When using the `equals` operator in the Search API, it behaves like `contains`, retrieving records that include the specified value


        **Single Condition:**

        If the condition is `(Company:equals:ABC)`, the response will include records with "ABC" as well as "ABC Inc" in the Company field.


        **Multiple Conditions:**

        `equals` still behaves like `contains`. For example, `((Company:equals:ABC) and (First_Name:starts_with:M))`, it retrieves records where the "First Name" starts with "M" and the "Company" contains "ABC" (e.g., "ABC" or "ABC Inc.").


        **Note:** The above behaviour does not apply to the **picklist field type**.


        **IN Operator:**

        The `in` operator checks if a field''s value matches any value in a given list.

        For example, `(Full_Name:in:Patricia,Boyle,Kate)`, it retrieves records where the Full Name is Patricia, Boyle, or Kate.


        **Special Character Handling:**

        When a single-line field value contains characters such as `{`, `}`, `[`, `]`, `^`, `:`, `-`, `/`, `!`, `?`, `*`, `_`, `@`, space, the Search API returns records with similar-looking values, even if the characters are not an exact match.


        For example, if Record A has the field value `sales-team@zoho.com` and Record B has `sales_team@zoho.com`, a search using `equals:sales-team@zoho.com` may return both records.


        **Escaping Special Characters:**

        When using parentheses `()`, commas `,`, or a backslash `\` as the last character in a search value, follow these steps:

        1. Escape special characters using a backslash `\`

        2. Encode the value before making the API request. Select the value of the criteria, right-click the value, and choose the EncodeURIComponent option.


        **Example 1: Escaping Parentheses and Commas**

        - Search term: `((Last_Name:equals:Burns,B) and (First_Name:starts_with:M))`

        - Escape the comma `\,`: `((Last_Name:equals:Burns\,B) and (First_Name:starts_with:M))`

        - Encode the value: `((Last_Name:equals:Burns%5C%2CB) and (First_Name:starts_with:M))`


        **Example 2: Escaping a Backslash at the End**

        - Search term: `(Last_Name:equals:K\)`

        - Escape the backslash `\\`: `(Last_Name:equals:K\\)`

        - Encode the value: `(Last_Name:equals:K%5C%5C)`


        **Supported Data Types:**

        `picklist`, `owner_lookup`, `user_lookup`, `lookup`, `phone`, `email`, `date`, `datetime`, `text`, `textarea`, `integer`, `currency`, `decimal`, `multiselectpicklist`, `bigint`, `percent`, `formula`, `website`, `boolean`, `double`


        **Supported Operators:**

        `equals`, `starts_with`, `in`, `not_equal`, `greater_equal`, `greater_than`, `less_equal`, `less_than`, `between`


        **Operator Compatibility by Data Type:**


        | Data Type | equals | starts_with | in | not_equal | greater_equal | greater_than | less_equal | less_than | between |

        |---|:---:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|

        | **text** | ✓ | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **textarea** | ✓ | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **email** | ✓ | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **phone** | ✓ | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **website** | ✓ | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **picklist** | ✓ | ✗ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **multiselectpicklist** | ✓ | ✗ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **lookup** | ✓ | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **owner_lookup** | ✓ | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **user_lookup** | ✓ | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **boolean** | ✓ | ✗ | ✗ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |

        | **integer** | ✓ | ✗ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |

        | **bigint** | ✓ | ✗ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |

        | **currency** | ✓ | ✗ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |

        | **decimal** | ✓ | ✗ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |

        | **double** | ✓ | ✗ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |

        | **percent** | ✓ | ✗ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |

        | **date** | ✓ | ✗ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |

        | **datetime** | ✓ | ✗ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |

        | **formula** | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ |


        **Legend:** ✓ = Supported, ✗ = Not Supported


        **Note:** Refer to the Zoho CRM API documentation for the most up-to-date operator compatibility information.'
      required: false
      schema:
        type: string
        maxLength: 3000
        description: Search criteria string with field API name, operator, and value
    IncludeChild:
