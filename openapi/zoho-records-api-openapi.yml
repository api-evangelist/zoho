    delete:
      operationId: deleteRecords
      summary: Delete multiple records from a module
      description: Permanently deletes one or more records from the specified module using comma-separated record IDs. Returns per-item results for bulk operations.
      parameters:
      - $ref: '#/components/parameters/Module'
      - $ref: '#/components/parameters/Ids'
      responses:
        '200':
          description: Successful deletion. Returns a success status for each deleted record.
          content:
            application/json:
              schema:
                type: object
                description: Response schema returned when one or more records are successfully deleted.
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: List of successfully deleted records with individual success details.
                    maxItems: 100
                    items:
                      type: object
                      description: Success object representing a single deleted record.
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          description: Machine-readable code indicating successful deletion.
                          enum:
                          - SUCCESS
                        details:
                          type: object
                          description: Additional metadata related to the deleted record.
                          additionalProperties: true
                          properties:
                            id:
                              type: string
                              description: Unique identifier of the record that was deleted.
                              format: int64
                          required:
                          - id
                        message:
                          type: string
                          description: Human-readable confirmation message for the deletion.
                          enum:
                          - record deleted
                        status:
                          type: string
                          description: Overall execution status of the delete operation for the record.
                          enum:
                          - success
                      required:
                      - code
                      - details
                      - message
                      - status
                required:
                - data
        '207':
          description: Multi-status response indicating that some records were deleted successfully while others failed.
          content:
            application/json:
              schema:
                type: object
                description: Response returned when a bulk delete operation results in mixed success and failure outcomes.
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: List of per-record results indicating whether each record deletion succeeded or failed.
                    maxItems: 100
                    items:
                      oneOf:
                      - type: object
                        description: Represents a successfully deleted record.
                        additionalProperties: false
                        properties:
                          status:
                            type: string
                            description: Indicates that the delete operation for the record was successful.
                            enum:
                            - success
                          code:
                            type: string
                            description: Success code returned for a deleted record.
                            enum:
                            - SUCCESS
                          message:
                            type: string
                            description: Message confirming successful deletion of the record.
                            maxLength: 1024
                          details:
                            type: object
                            description: Additional information about the deleted record.
                            additionalProperties: false
                            properties:
                              id:
                                type: string
                                description: Unique identifier of the deleted record.
                                format: int64
                        required:
                        - status
                        - code
                        - message
                        - details
                      - type: object
                        additionalProperties: false
                        description: Represents a record deletion failure.
                        properties:
                          status:
                            type: string
                            description: Indicates that the delete operation for the record failed.
                            enum:
                            - error
                          code:
                            type: string
                            description: Error code describing why the record could not be deleted.
                            enum:
                            - INVALID_DATA
                            - REQUIRED_PARAM_MISSING
                          message:
                            type: string
                            description: Message explaining the reason for the deletion failure.
                            maxLength: 1024
                          details:
                            type: object
                            description: Additional context about the deletion error.
                            additionalProperties: true
                            properties:
                              api_name:
                                type: string
                                description: API name associated with the error.
                                maxLength: 255
                              id:
                                type: string
                                format: int64
                                description: Identifier of the record that failed to delete.
                              param:
                                type: string
                                maxLength: 1024
                                description: Request parameter that caused the error.
                              param_name:
                                type: string
                                maxLength: 255
                                description: Name of the invalid or missing parameter.
                        required:
                        - status
                        - code
                        - message
                        - details
        '400':
          description: Bad request due to invalid module, missing parameters, or invalid record IDs.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  description: Response schema returned when one or more records fail to delete due to invalid data in a bulk delete operation.
                  properties:
                    data:
                      type: array
                      description: List of error objects for each record that failed to delete.
                      maxItems: 100
                      items:
                        type: object
                        description: Error object representing a single record deletion failure.
                        additionalProperties: false
                        properties:
                          code:
                            type: string
                            description: Error code indicating lack of delete permission.
                            enum:
                            - NO_PERMISSION
                          message:
                            type: string
                            maxLength: 1024
                            description: Message explaining why the delete operation is forbidden.
                          status:
                            type: string
                            description: Status indicating the failure of the request.
                            enum:
                            - error
                          details:
                            type: object
                            description: Details indicating the failure of the request.
                            additionalProperties: true
                            properties:
                              id:
                                description: Failed ID
                                format: int64
                                type: string
                        required:
                        - status
                        - code
                        - message
                        - details
                - type: object
                  additionalProperties: false
                  description: Response schema returned when a record fails to delete due to various errors.
                  properties:
                    status:
                      type: string
                      description: Overall execution status of the request.
                      enum:
                      - error
                    code:
                      type: string
                      description: Error code indicating the reason for deletion failure.
                      enum:
                      - INVALID_DATA
                      - INVALID_MODULE
                      - REQUIRED_PARAM_MISSING
                      - NOT_SUPPORTED
                      - UNABLE_TO_PARSE_DATA_TYPE
                      - INVALID_REQUEST_METHOD
                      - AUTHORIZATION_FAILED
                      - RECORD_LOCKED
                      - NOT_APPROVED
                    message:
                      description: Human-readable message describing the error encountered during deletion.
                      type: string
                      maxLength: 1024
                    details:
                      type: object
                      description: Additional context about the deletion error.
                      additionalProperties: false
                      properties:
                        api_name:
                          description: API name associated with the error.
                          type: string
                          maxLength: 255
                        id:
                          description: Identifier of the record that failed to delete.
                          type: string
                          format: int64
                        param:
                          description: Request parameter that caused the error.
                          type: string
                          maxLength: 1024
                        param_name:
                          description: Name of the invalid or missing parameter.
                          type: string
                          maxLength: 255
                  required:
                  - status
                  - code
                  - message
                  - details
        '401':
          description: Unauthorized response returned when the OAuth token does not contain the required delete scope.
          content:
            application/json:
              schema:
                type: object
                description: Error response indicating an OAuth scope mismatch.
                additionalProperties: false
                properties:
                  code:
                    type: string
                    description: Error code representing the reason for authorization failure.
                    enum:
                    - OAUTH_SCOPE_MISMATCH
                  message:
                    type: string
                    maxLength: 1024
                    description: Human-readable message describing the authorization error.
                  status:
                    type: string
                    description: Status indicating the result of the API request.
                    enum:
                    - error
                required:
                - code
                - message
                - status
        '403':
          description: Forbidden response returned when the user does not have permission to delete records.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: Error response indicating insufficient privileges to perform delete operation.
                properties:
                  code:
                    type: string
                    description: Error code indicating lack of delete permission.
                    enum:
