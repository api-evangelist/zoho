      - $ref: '#/components/parameters/id'
      - name: title
        in: query
        description: title of the help article !@wildcard search@!
        required: false
        style: form
        explode: true
        schema:
          type:
          - string
          - 'null'
          description: title of the help article !@wildcard search@!
          maxLength: 500
          minLength: 0
      - name: categoryId
        in: query
        description: 'ID of the Category '
        required: false
        style: form
        explode: true
        schema:
          type:
          - string
          - 'null'
          - integer
          format: int64
          description: 'ID of the Category '
          pattern: ([0-9]+)
      - $ref: '#/components/parameters/_all'
