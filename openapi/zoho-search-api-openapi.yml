  /api/v1/search:
    get:
      tags:
      - Search
      summary: Search across modules
      description: This API returns information from all modules or a specific module, based on the value of the module query param.
      operationId: doSearch
      parameters:
      - name: searchStr
        in: query
        description: Keyword or phrase to search
        required: false
        style: form
        explode: true
        schema:
          type:
          - string
          - 'null'
          description: Keyword or phrase to search
          maxLength: 100
          minLength: 0
      - name: module
        in: query
        description: 'Module to search in: @tickets@, @accounts@, @contacts@ or @tasks@. The default response includes all modules.'
        required: false
        style: form
        explode: true
        schema:
          type:
          - string
          - 'null'
          description: 'Module to search in: @tickets@, @accounts@, @contacts@ or @tasks@. The default response includes all modules.'
          enum:
          - tickets
          maxLength: 100
          minLength: 0
      - $ref: '#/components/parameters/departmentId'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/from'
      - name: sortBy
        in: query
        description: 'Sort by a specific attribute: @relevance@ or @modifiedTime@'
        required: false
        style: form
        explode: true
        schema:
          type:
          - string
          - 'null'
          description: 'Sort by a specific attribute: @relevance@ or @modifiedTime@'
          enum:
          - relevance
          - modifiedTime
          maxLength: 100
          minLength: 0
      - $ref: ./Common.json#/components/parameters/orgId
      responses:
        '422':
          $ref: ./Common.json#/components/responses/multipleUnprocessEntityResponse
        '204':
          $ref: ./Common.json#/components/responses/emptyResponse
        '200':
          $ref: '#/components/responses/doSearchResponse'
      security:
      - iam-oauth2-schema:
        - Desk.contacts.READ
        - Desk.tickets.READ
        - Desk.tasks.READ
        - Desk.search.READ
      x-audience:
      - external-public
  /api/v1/tasks/search:
    get:
      tags:
