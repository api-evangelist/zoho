  schemas:
    ErrorDetails:
      type: object
      description: Specific details about the error, often including which parameter or value caused the issue.
      additionalProperties: false
    ErrorResponse:
      type: object
      description: Standard error response structure containing error code, message, and optional details
      additionalProperties: false
      properties:
        code:
          type: string
          description: The specific error code.
          enum:
          - INVALID_DATA
          - INVALID_QUERY
          - EXPECTED_PARAM_MISSING
          - LIMIT_REACHED
          - NOT_SUPPORTED
          - INVALID_REQUEST_METHOD
          - AUTHORIZATION_FAILED
          - OAUTH_SCOPE_MISMATCH
          - NO_PERMISSION
          - INVALID_URL_PATTERN
          - INTERNAL_ERROR
          - RATE_LIMIT_EXCEEDED
          - SERVICE_UNAVAILABLE
          - INVALID_MODULE
        details:
          $ref: '#/components/schemas/ErrorDetails'
        message:
          type: string
          description: A human-readable error message.
          maxLength: 1000
        status:
          type: string
          description: Status indicator for the response, always 'error' for error responses
          enum:
          - error
          default: error
      required:
      - code
      - details
      - message
      - status
  securitySchemes:
    iam-oauth2-schema:
      $ref: ./Common.json#/components/securitySchemes/iam-oauth2-schema
