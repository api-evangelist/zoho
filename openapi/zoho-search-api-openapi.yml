      name: word
      in: query
      required: false
      description: 'A simple word or phrase to search across all supported text fields in the module. Performs a global search with minimum 2 characters required. This is the broadest search method but may be slower than specific field searches.

        *Mandatory if criteria, email, and phone are not present.*'
      schema:
        type: string
        minLength: 2
        maxLength: 100
    SortOrder:
      name: sort_order
      in: query
      required: false
      description: The sorting direction for the results. Use 'asc' for ascending (A-Z, 1-9, oldest first) or 'desc' for descending (Z-A, 9-1, newest first).
      schema:
        type: string
        maxLength: 10
        enum:
        - asc
        - desc
        default: desc
    SearchPhone:
      name: phone
      in: query
      required: false
      description: 'Search records by phone number across all phone fields in the module. Supports various phone number formats including international, national, and partial numbers.

        *Mandatory if criteria, email, and word are not present.*'
      schema:
        type: string
        minLength: 3
        maxLength: 50
        pattern: ^[+]?[0-9\s\-\(\)\.]+$
    SearchEmail:
      name: email
      in: query
      required: false
      description: 'Search records by email address across all email fields in the module. Supports partial matches and searches multiple email fields simultaneously.

        *Mandatory if criteria, phone, and word are not present.*'
      schema:
        type: string
        maxLength: 255
        format: string
    ApprovalState:
      name: approval_state
      in: query
      required: false
      description: Filter records by their approval status. This parameter is particularly useful for modules with approval workflows or data validation processes.
      schema:
        type: string
        maxLength: 50
        enum:
        - approval_process_pending
        - webform_invalid
        - review_process_pending
        - webform_invalid_approval
        - zia_vision_validation
        - review_process_rejected
        - webform_unapproved
        - email_parser_waiting
        - approved
        - merge_pending
        - email_parser_rejected
        - zia_vision_rejected
        - zia_vision_pending
        - approval_process_rejected
        - webform_double_optin
    SortBy:
      name: sort_by
      in: query
      required: false
      description: The field API name to sort the search results by. Choose a field that exists in the target module for consistent sorting behavior.
      schema:
        type: string
        maxLength: 100
        default: id
    Page:
      name: page
      in: query
      required: false
      description: The page number to retrieve for paginated results. Use in combination with per_page to navigate through large result sets.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    Converted:
      name: converted
      in: query
      required: false
      description: Filter records by their conversion status. Primarily used with Leads module to distinguish between converted and non-converted leads. Also applicable to other modules with conversion workflows.
      schema:
        type: string
        maxLength: 10
        enum:
        - 'true'
        - 'false'
        - both
        default: 'false'
    Criteria:
      name: criteria
      in: query
      required: false
      description: 'Complex query string to search for records using field-specific conditions and operators. Supports up to 15 conditions combined with AND/OR operators. **Format:** `(field_name:operator:value)` with logical operators.

        *Mandatory if email, phone, and word are not present.*'
      schema:
        type: string
        maxLength: 3000
