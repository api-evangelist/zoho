components:
  parameters:
    from:
      name: from
      in: query
      description: 'The starting index for fetching results. !@default : 0@! !@starts from 0@!'
      required: false
      style: form
      explode: true
      schema:
        type:
        - string
        - 'null'
        - integer
        format: int32
        description: 'The starting index for fetching results. !@default : 0@! !@starts from 0@!'
        pattern: ([0-9]+)
    status:
      name: status
      in: query
      description: 'Status of the ticket inclusive of custom status. example: 1. status=open,in progress 2. status=${open}  !@exact match@!'
      required: false
      style: form
      explode: true
      schema:
        type:
        - string
        - 'null'
        description: 'Status of the ticket inclusive of custom status. example: 1. status=open,in progress 2. status=${open}  !@exact match@!'
        x-dynamic-enum: true
    subject:
      name: subject
      in: query
      description: Subject of the ticket !@wildcard search@!
      required: false
      style: form
      explode: true
      schema:
        type:
        - string
        - 'null'
        description: Subject of the ticket !@wildcard search@!
        maxLength: 1000
        minLength: 0
    departmentId:
      name: departmentId
      in: query
      description: ID of the department from which the entity must be fetched. If the ID is not passed, then searches in all permitted departments !@exact match@!
      required: false
      style: form
      explode: true
      schema:
        type:
        - string
        - 'null'
        - integer
        format: int64
        description: ID of the department from which the entity must be fetched. If the ID is not passed, then searches in all permitted departments !@exact match@!
        pattern: ([0-9]+)
    assigneeId:
      name: assigneeId
      in: query
      description: ID of the agent who is assigned to resolve the ticket !@exact match@!
      required: false
      style: form
      explode: true
      schema:
        type:
        - string
        - 'null'
        - integer
        format: int64
        description: ID of the agent who is assigned to resolve the ticket !@exact match@!
        pattern: ([0-9]+)
    modifiedTimeRange:
      name: modifiedTimeRange
      in: query
      description: Key that filters tickets modified in a particular period of time. !Enter the from and to dates in the ISO date format of yyyy-MM-ddThh:mm:ss.SSSZ;! !For example,! modifiedTimeRange=2017-11-05T00:00:00.000Z,2018-09-05T23:59:00.000Z
      required: false
      style: form
      explode: true
      schema:
        type:
        - string
        - 'null'
        description: Key that filters tickets modified in a particular period of time. !Enter the from and to dates in the ISO date format of yyyy-MM-ddThh:mm:ss.SSSZ;! !For example,! modifiedTimeRange=2017-11-05T00:00:00.000Z,2018-09-05T23:59:00.000Z
        maxLength: 100
        minLength: 0
        pattern: (((19|20)\d\d)[-/.]{1}(0?[1-9]|1[012])[-/.]{1}(0?[1-9]|[12][0-9]|3[01])(T)([01]?[0-9]|2[0-3]):[0-5]?[0-9]:[0-5]?[0-9]([/.][\d]{0,3})?(Z)),(((19|20)\d\d)[-/.]{1}(0?[1-9]|1[012])[-/.]{1}(0?[1-9]|[12][0-9]|3[01])(T)([01]?[0-9]|2[0-3]):[0-5]?[0-9]:[0-5]?[0-9]([/.][\d]{0,3})?(Z))|null
    accountId:
      name: accountId
      in: query
      description: ID of the account associated with the ticket !@exact match@!
      required: false
      style: form
      explode: true
      schema:
        type:
        - string
        - 'null'
        - integer
        format: int64
        description: ID of the account associated with the ticket !@exact match@!
        pattern: ([0-9]+)
    _all:
      name: _all
      in: query
      description: Key that includes all the columns in the tickets module for search !@wildcard search@!
      required: false
      style: form
      explode: true
      schema:
        type:
        - string
        - 'null'
        description: Key that includes all the columns in the tickets module for search !@wildcard search@!
        maxLength: 100
        minLength: 0
    startDateRange:
      name: startDateRange
      in: query
      description: Key that filters calls that were made in a particular period. !Enter the from and to dates in the ISO date format of yyyy-MM-ddThh:mm:ss.SSSZ;! !For example,! startDateRange=2017-11-05T00:00:00.000Z,2018-09-05T23:59:00.000Z
      required: false
      style: form
      explode: true
      schema:
        type:
        - string
        - 'null'
        description: Key that filters calls that were made in a particular period. !Enter the from and to dates in the ISO date format of yyyy-MM-ddThh:mm:ss.SSSZ;! !For example,! startDateRange=2017-11-05T00:00:00.000Z,2018-09-05T23:59:00.000Z
        maxLength: 100
        minLength: 0
        pattern: (((19|20)\d\d)[-/.]{1}(0?[1-9]|1[012])[-/.]{1}(0?[1-9]|[12][0-9]|3[01])(T)([01]?[0-9]|2[0-3]):[0-5]?[0-9]:[0-5]?[0-9]([/.][\d]{0,3})?(Z)),(((19|20)\d\d)[-/.]{1}(0?[1-9]|1[012])[-/.]{1}(0?[1-9]|[12][0-9]|3[01])(T)([01]?[0-9]|2[0-3]):[0-5]?[0-9]:[0-5]?[0-9]([/.][\d]{0,3})?(Z))|null
    contactId:
      name: contactId
      in: query
      description: 'ID of the contact who raised the ticket !@exact match@! '
      required: false
      style: form
      explode: true
      schema:
        type:
        - string
        - 'null'
