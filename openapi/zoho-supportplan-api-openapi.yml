                  isAdditionalUsageAllowed: false
                  isCarryForwardAllowed: false
                  creditLimit: '10'
                  creditCycle: Weekly
                departmentId: '146284000010377075'
                name: SupportPlan for GoldCustomer
                status: ACTIVE
  securitySchemes:
    iam-oauth2-schema:
      $ref: ./Common.json#/components/securitySchemes/iam-oauth2-schema
