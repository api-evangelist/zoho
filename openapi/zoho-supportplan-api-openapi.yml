  parameters:
    supportPlanId:
      name: supportPlanId
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type:
        - string
        - 'null'
        - integer
        format: int64
        pattern: ([0-9]+)
  requestBodies:
    updateSupportPlanPayload:
      content:
        application/json:
          schema:
            type:
            - 'null'
            - object
            additionalProperties: false
            properties:
              supportType:
                type:
                - string
                - 'null'
                enum:
                - UNLIMITED_SUPPORT
                - HOURS
                - TICKETS
                - PRICE
                maxLength: 100
                minLength: 0
              slaId:
                type:
                - string
                - 'null'
                - integer
                format: int64
                pattern: ([0-9]+)
              creditDetails:
                $ref: ./SupportPlan.json#/components/schemas/creditDetails
              name:
                type:
                - string
                - 'null'
                maxLength: 100
                minLength: 0
                pattern: ([0-9a-zA-Z_\-\.\$@\?\,\:\'\/\!\P{InBasicLatin}\s])+
              status:
                type:
                - string
                - 'null'
                enum:
                - ACTIVE
                - DISCONTINUED
                maxLength: 100
                minLength: 0
          examples:
            Valid requestBody Definitions:
              value:
                supportType: Hours
                slaId: '146284000033706001'
                creditDetails:
                  isAdditionalUsageAllowed: false
                  isCarryForwardAllowed: false
                  creditLimit: '10'
                  creditCycle: Weekly
