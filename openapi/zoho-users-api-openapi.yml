components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: User ID to be transferred and deleted
      schema:
        type: string
        format: int64
    JobId:
      name: job_id
      in: query
      required: true
      description: Unique identifier for the transfer job to check status
      schema:
        type: string
        format: int64
    PerPage:
      name: per_page
      in: query
      required: false
      description: Number of items to return per page
      schema:
        type: integer
        format: int32
        default: 200
        maximum: 200
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      description: Page number to retrieve
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
    Include:
      name: include
      in: query
      required: false
      description: Additional data to include in the response
      schema:
        type: string
        enum:
        - sources_count
        - sources
    User:
      description: The ID of the user
      name: user
      in: path
      required: true
      schema:
        format: int64
        type: string
    Ids:
      description: Comma-separated IDs (each ID is an int64)
      name: ids
      in: query
      required: true
      schema:
        type: string
        description: Comma-separated IDs (digits only, separated by commas)
        pattern: ^[0-9]+(,[0-9]+)*$
        maxLength: 2000
    Territory:
      description: The ID of the territory
      name: territory
      in: path
      required: true
      schema:
        format: int64
        type: string
    User_2:
      name: user
      in: path
      description: user Id
      required: true
      schema:
        type: string
        maxLength: 20
    PerPage_2:
      name: per_page
      in: query
      description: Number of records per page
      required: false
      schema:
        type: integer
        format: int32
    Type:
      name: type
      in: query
      description: type of users
      required: false
      schema:
        type: string
        enum:
        - CurrentUser
        - DeletedUsers
        - DeactiveUsers
        - NotConfirmedUsers
        - ConfirmedUsers
        - ActiveUsers
        - AdminUsers
        - ActiveConfirmedAdmins
        - ActiveConfirmedUsers
        - DeveloperUsers
        - AllUsers
        - AllActiveUsers
        - ActiveLiteUser
    Page_2:
      name: page
      in: query
      description: Current page number
      required: false
      schema:
        type: integer
        format: int32
  schemas:
    TerritoryGetResponse:
      additionalProperties: false
      description: Response schema for getting territories of a user
      type: object
      properties:
        territories:
          type: array
          description: List of territories assigned to the user
          minItems: 0
          maxItems: 200
          uniqueItems: true
          items:
            type: object
            description: Territory details
            additionalProperties: false
            properties:
              id:
                type: string
                description: Territory ID
                format: int64
              Manager:
                type: object
                description: Territory manager details
                additionalProperties: false
                properties:
                  Name:
                    type: string
                    description: Manager name
                    maxLength: 255
                  id:
                    type: string
                    description: Manager ID
                    format: int64
              Reporting_To:
                type: object
                description: Reporting manager details
                additionalProperties: false
                properties:
                  Name:
                    type: string
                    description: Reporting manager name
                    maxLength: 255
                  id:
                    type: string
                    description: Reporting manager ID
                    format: int64
                required:
                - Name
                - id
              Name:
                type: string
                description: Territory name
                maxLength: 255
            required:
            - id
            - Manager
            - Reporting_To
            - Name
        info:
          type: object
          description: Pagination information
          additionalProperties: false
          properties:
            count:
              type: integer
              description: Number of records returned
              format: int32
            page:
              type: integer
              description: Current page number
              format: int32
            per_page:
              type: integer
              description: Records per page
              format: int32
            more_records:
              type: boolean
              description: Whether more records exist
          required:
          - count
          - page
          - per_page
          - more_records
      required:
      - territories
      - info
    SuccessResponse:
      type: object
      additionalProperties: false
      description: Response for successful association of territories to a user
      properties:
        territories:
          type: array
          description: List of per-territory result items
          minItems: 0
          maxItems: 200
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            description: Per-territory result item
            properties:
              code:
                type: string
                description: Result code
                enum:
                - SUCCESS
              details:
                type: object
                description: Details for the result item
                additionalProperties: false
                properties:
                  id:
                    type: string
                    format: int64
                    description: ID of the territory
                required:
                - id
              message:
                type: string
                description: Human-readable message
                maxLength: 1000
              status:
                type: string
                description: Status of the result
                enum:
                - success
            required:
            - code
            - details
            - message
            - status
      required:
      - territories
    CommonErrorResponse:
      type: object
      additionalProperties: false
      description: Response containing an array of per-territory error items
      properties:
        territories:
          type: array
          description: List of per-territory error items
          minItems: 0
          maxItems: 200
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            description: Per-territory error object for territory-specific validation failures
            properties:
              code:
                type: string
                description: Error code
                enum:
                - INVALID_DATA
                - DUPLICATE_DATA
                - PERMISSION_DENIED
              details:
                type: object
                description: Error details for the territory
                additionalProperties: false
                properties:
                  api_name:
                    type: string
                    description: The API field name related to the error
                    maxLength: 255
                  json_path:
                    type: string
                    description: JSON path that points to the invalid value
                    maxLength: 1000
              message:
                type: string
                description: Human-readable error message
                maxLength: 1000
              status:
                type: string
                description: Status of the error
                enum:
                - error
            required:
            - code
            - details
            - status
      required:
      - territories
    CommonUrlErrorResponse:
      type: object
      additionalProperties: false
      description: Error response for INVALID_DATA that includes a resource_path_index in details
      properties:
        code:
          type: string
          description: Error code
          enum:
          - INVALID_DATA
          - NOT_ALLOWED
        details:
          type: object
          description: Error details containing resource path index
          additionalProperties: false
          properties:
            resource_path_index:
              type: integer
              description: Index of the resource path
              format: int32
        message:
          type: string
          description: Human readable error message
          maxLength: 1000
        status:
          type: string
          description: Status of the error
          enum:
          - error
      required:
      - code
      - details
      - status
    UserDetails:
      type: object
      description: User details
      properties:
        $current_shift:
          readOnly: true
          description: Current shift assigned to the user
          oneOf:
          - type: object
            description: Current shift details
            properties:
              name:
                type: string
                description: Name of the shift
                maxLength: 80
              id:
                type: string
                maxLength: 20
                description: ID of the shift
            additionalProperties: false
            required:
            - id
          - type: 'null'
            description: No current shift assigned
        $next_shift:
          description: Next shift assigned to the user
          oneOf:
          - type: object
            description: Next shift details
            properties:
              name:
                type: string
                description: Name of the shift
                maxLength: 80
              id:
                type: string
                maxLength: 20
                description: ID of the shift
            additionalProperties: false
            required:
            - name
            - id
          - type: 'null'
            description: No next shift assigned
        Current_Shift__s:
          description: To update current shift for the user
          oneOf:
          - type: string
            description: Current shift ID to be updated
            maxLength: 20
          - type: 'null'
            description: No current shift assigned
        $shift_effective_from:
