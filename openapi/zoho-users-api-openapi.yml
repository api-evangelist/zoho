    delete:
      description: Delete a user by ID. API exposed to customers
      summary: Delete a User
      operationId: deleteUser
      parameters:
      - $ref: '#/components/parameters/User_2'
      security:
      - iam-oauth2-schema:
        - ZohoCRM.users.DELETE
      responses:
        '200':
          description: A user deleted successfully
          content:
            application/json:
              schema:
                description: Delete a User Success Response
                type: object
                properties:
                  users:
                    type: array
                    maxItems: 1
                    description: User deletion success response
                    items:
                      description: User deletion response object
                      type: object
                      properties:
                        code:
                          type: string
                          description: Response code
                          enum:
                          - SUCCESS
                        details:
                          type: object
                          description: Details of the deleted user
                          properties:
                            id:
                              type: string
                              description: ID of the deleted user
                              maxLength: 20
                          required:
                          - id
                          additionalProperties: false
                        message:
                          type: string
                          description: deleted message
                          enum:
                          - User deleted
                        status:
                          type: string
                          description: deletion status
                          enum:
                          - success
                      additionalProperties: false
                additionalProperties: false
        '400':
          description: Error response
          content:
            application/json:
              schema:
                description: Delete User Error Response
                oneOf:
                - description: User Deletion Error Response
                  type: object
                  properties:
                    code:
                      type: string
                      description: Error code
                      enum:
                      - INVALID_DATA
                    details:
                      type: object
                      description: Details about the error
                      properties:
                        resource_path_index:
                          type: integer
                          description: Index of the resource path in case of multiple resource paths
                          format: int32
                      additionalProperties: false
                    message:
                      type: string
                      description: Error message
                      enum:
                      - the id given seems to be invalid
                    status:
                      type: string
                      description: Response status
                      enum:
                      - error
                  additionalProperties: false
                - description: User Deletion Error Response
                  type: object
                  properties:
                    users:
                      type: array
                      maxItems: 1
                      description: User deletion error response
                      items:
                        description: User deletion error object
                        type: object
                        properties:
                          code:
                            type: string
                            description: Error code
                            enum:
                            - NOT_ALLOWED
                            - AUTHORIZATION_FAILED
                            - ID_ALREADY_DELETED
                            - INVALID_REQUEST
                          details:
                            type: object
                            description: Details about the error
                            properties:
                              resource_path_index:
                                type: integer
                                description: Index of the resource path in case of multiple resource paths
                                format: int32
                              json_path:
                                type: string
                                description: JSON path of the field causing the error
                                enum:
                                - $.users[0].id
                              id:
                                type: string
                                description: ID of the user causing the error
                                maxLength: 20
                            additionalProperties: false
                          message:
                            type: string
                            description: Error message
                            enum:
                            - the id given seems to be invalid
                            - You cannot delete user in a sandbox org
                            - Support user cannot be deleted
                            - System user cannot be deleted
                            - User does not have sufficient previlege to delete users
                            - User is already deleted
                            - Digital Employee cannot be deleted/deactivated/activated
                            - Primary contact cannot be deleted
                          status:
                            type: string
                            description: Response status
                            enum:
                            - error
                        additionalProperties: false
                  additionalProperties: false
